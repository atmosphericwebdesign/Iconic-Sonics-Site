# Rebuilds the site every 3 hours so new episodes and videos show up on their own.
# Setup: in Vercel > Project > Settings > Git > Deploy Hooks, create a hook for the main branch,
# then add its URL in GitHub > Repo > Settings > Secrets and variables > Actions as VERCEL_DEPLOY_HOOK.
name: Scheduled rebuild
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then echo "VERCEL_DEPLOY_HOOK not set"; exit 0; fi
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
